# Verificação automática: roda lint, tipos, testes e build em cada pull request
# e em cada mudança na main. Um ❌ aqui impede que a mudança chegue à produção.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: pnpm check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Usa a versão do pnpm definida em package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
