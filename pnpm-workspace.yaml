packages:
  - "apps/*"
  - "packages/*"

# Store do pnpm dentro do projeto (o repositório pode ficar em um disco externo).
storeDir: .pnpm-store

# Pacotes autorizados a rodar scripts de instalação.
allowBuilds:
  esbuild: true

# Versões compartilhadas por todos os pacotes (use "catalog:" no package.json).
catalog:
  "@biomejs/biome": 2.6.3
  "@fontsource-variable/dm-sans": 5.3.0
  "@radix-ui/react-checkbox": 1.4.1
  "@radix-ui/react-label": 2.1.17
  "@radix-ui/react-popover": 1.3.1
  "@radix-ui/react-radio-group": 1.5.1
  "@radix-ui/react-slot": 1.5.0
  "@storybook/addon-docs": 9.1.21
  "@storybook/react-vite": 9.1.21
  "@tabler/icons-react": 3.49.0
  "@tailwindcss/vite": 4.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  axe-core: 4.14.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  jsdom: 30.1.2
  react: 19.3.1
  react-dom: 19.3.1
  storybook: 9.1.21
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.10
  typescript: 7.0.2
  # Storybook 9 suporta Vite até a 7.x.
  vite: 7.3.7
  vitest: 5.0.5
